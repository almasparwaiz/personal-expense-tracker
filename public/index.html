<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-wallet"></i> Expense Tracker</h1>
            <p>Manage your daily expenses efficiently</p>
        </header>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="card">
                <h3>Total Amount Spent</h3>
                <p id="totalAmount">$0.00</p>
            </div>
        </div>

        <div class="main-content">
            <!-- Expense Form -->
            <section class="form-section">
                <h2>Add New Expense</h2>
                <form id="expenseForm">
                    <div class="input-group">
                        <label for="title">Expense Title</label>
                        <input type="text" id="title" placeholder="e.g., Groceries, Uber" required>
                    </div>

                    <div class="input-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="input-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <button type="submit" class="btn-primary">Add Expense</button>
                </form>
            </section>

            <!-- Expense Table Section -->
            <section class="table-section">
                <h2>Expense Records</h2>
                <div class="table-container">
                    <table id="expenseTable">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expenseList">
                            <!-- Dynamic Rows will appear here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- Firebase SDK Scripts (Modular CDN) -->
    <script type="module" src="app.js"></script>
</body>
</html>
